
name: Windows 11

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secure-rdp:
    runs-on: windows-2022
    timeout-minutes: 350

    steps:
      - name: Configure RDP securely
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          # Enable Remote Desktop while keeping NLA and encryption enabled.
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' `
            -Value 0

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication' `
            -Value 1

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'SecurityLayer' `
            -Value 2

          # Enable the built-in RDP firewall rules.
          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'

          # Do not create a public inbound RDP rule.
          Write-Host "RDP configured with NLA and the standard security layer."

      - name: Create temporary RDP user
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw "Set the RDP_PASSWORD repository secret first."
          }

          $securePassword = ConvertTo-SecureString `
            $env:RDP_PASSWORD -AsPlainText -Force

          $user = Get-LocalUser -Name "RDP" `
            -ErrorAction SilentlyContinue

          if (-not $user) {
            New-LocalUser `
              -Name "RDP" `
              -Password $securePassword `
              -Description "Temporary remote desktop account" `
              -AccountNeverExpires
          } else {
            Set-LocalUser -Name "RDP" -Password $securePassword
          }

          # Grant RDP access without administrator privileges.
          $rdpGroup = Get-LocalGroup -SID 'S-1-5-32-555'
          $members = Get-LocalGroupMember -Group $rdpGroup.Name

          if ($members.Name -notcontains "$env:COMPUTERNAME\RDP") {
            Add-LocalGroupMember -Group $rdpGroup.Name -Member "RDP"
          }

          Write-Host "Temporary RDP account configured."

      - name: Download and install NetBird
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $release = Invoke-RestMethod `
            -Uri "https://api.github.com/repos/netbirdio/netbird/releases/latest" `
            -UserAgent "GitHub-Actions"

          $asset = $release.assets |
            Where-Object {
              $_.name -match 'windows_amd64\.msi$'
            } |
            Select-Object -First 1

          if (-not $asset) {
            throw "Could not find the NetBird Windows AMD64 installer."
          }

          $installer = Join-Path $env:TEMP "netbird.msi"

          Invoke-WebRequest `
            -Uri $asset.browser_download_url `
            -OutFile $installer

          $process = Start-Process `
            -FilePath "msiexec.exe" `
            -ArgumentList "/i `"$installer`" /quiet /norestart" `
            -Wait `
            -PassThru

          Remove-Item $installer -Force -ErrorAction SilentlyContinue

          if ($process.ExitCode -ne 0) {
            throw "NetBird MSI installation failed: exit code $($process.ExitCode)"
          }

          $netbird = Join-Path $env:ProgramFiles "NetBird\netbird.exe"

          if (-not (Test-Path $netbird)) {
            throw "NetBird executable was not found at $netbird."
          }

          Write-Host "NetBird installation completed."

      - name: Connect to NetBird
        shell: powershell
        env:
          NETBIRD_SETUP_KEY: ${{ secrets.NETBIRD_SETUP_KEY }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:NETBIRD_SETUP_KEY)) {
            throw "Set the NETBIRD_SETUP_KEY repository secret first."
          }

          $netbird = Join-Path $env:ProgramFiles "NetBird\netbird.exe"

          & $netbird up --setup-key $env:NETBIRD_SETUP_KEY

          if ($LASTEXITCODE -ne 0) {
            throw "NetBird connection command failed."
          }

          $nbIP = $null

          for ($i = 0; $i -lt 12 -and -not $nbIP; $i++) {
            Start-Sleep -Seconds 5

            $status = & $netbird status 2>&1
            $statusText = $status -join "`n"

            if ($statusText -match '(\d{1,3}(?:\.\d{1,3}){3})') {
              $candidate = $Matches[1]

              # Accept only an address in NetBird's usual IPv4 range.
              if ($candidate -match '^100\.') {
                $nbIP = $candidate
              }
            }
          }

          if (-not $nbIP) {
            & $netbird status
            throw "Could not determine the NetBird IPv4 address."
          }

          "NETBIRD_IP=$nbIP" >> $env:GITHUB_ENV
          Write-Host "NetBird IP: $nbIP"

      - name: Verify local RDP listener
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $listener = Get-NetTCPConnection `
            -State Listen `
            -LocalPort 3389 `
            -ErrorAction SilentlyContinue

          if (-not $listener) {
            throw "No RDP listener was found on TCP port 3389."
          }

          Write-Host "RDP listener is active."

      - name: Set up MATLAB R2024b
        uses: matlab-actions/setup-matlab@v2
        with:
          release: R2024b

      - name: Keep runner alive
        shell: powershell
        run: |
          Write-Host "Temporary Windows runner is ready."
          Write-Host "NetBird IP: $env:NETBIRD_IP"
          Write-Host "RDP username: RDP"
          Write-Host "Do not print passwords or setup keys in logs."
          Write-Host "Use Ctrl+C or cancel the workflow to stop the runner."

          while ($true) {
            Start-Sleep -Seconds 300
            Write-Host "Runner heartbeat: $(Get-Date -Format o)"
          }
